# build.yml — 云端编译工作流 / Cloud build workflow
#
# 作用：让任何人在 GitHub 上点击即可编译出静态二进制，无需本地环境。
# What it does: lets anyone build the static binaries on GitHub with one click,
# no local toolchain required.
#
# 产物 / Artifacts:
#   - apt-<arch>-musl    (musl 静态链接，最干净 / musl static, cleanest)
#   - apt-<arch>-glibc   (glibc 静态链接 / glibc static)
# 打 tag（形如 v1.0.0）会额外创建 Release 并附带这些二进制。
# Pushing a tag (e.g. v1.0.0) additionally creates a Release with these binaries.

name: build

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:        # 允许在 Actions 页面手动触发 / allow manual runs

jobs:
  build:
    name: build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v4

      - name: Install musl toolchain / 安装 musl 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build (musl static) / 构建（musl 静态）
        run: musl-gcc -O2 -static -s -o "apt-${ARCH}-musl" apt-compat.c apt-backends.c

      - name: Build (glibc static) / 构建（glibc 静态）
        run: gcc -O2 -static -s -o "apt-${ARCH}-glibc" apt-compat.c apt-backends.c

      - name: Verify static / 校验静态链接
        run: |
          for f in "apt-${ARCH}-musl" "apt-${ARCH}-glibc"; do
            echo "== $f =="
            file "$f"
            ldd "$f" 2>&1 || true          # 期望 "not a dynamic executable"
            ./"$f" --version || true
          done

      - name: Upload artifacts / 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: apt-${{ matrix.arch }}
          path: apt-${{ matrix.arch }}-*
          if-no-files-found: error

  release:
    name: release
    needs: build
    # 打 tag 或推送到主分支时都发布 / publish on tags and on pushes to the main branch
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts / 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 打 tag：发布以 tag 命名的正式 Release
      # tag push: publish a proper Release named after the tag
      - name: Publish release for tag / 发布 tag 正式版
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      # 主分支推送：滚动更新一个 latest 预发布，始终附带最新二进制
      # branch push: rolling "latest" pre-release with the newest binaries
      - name: Publish rolling latest / 发布滚动 latest
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest (rolling build)
          prerelease: true
          files: dist/*
          body: |
            自动构建 / Automatic build from `${{ github.sha }}`.
            产物 / Artifacts: musl 与 glibc 静态二进制（x86_64, aarch64）。
            musl and glibc static binaries (x86_64, aarch64).
